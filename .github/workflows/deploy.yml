name: Deploy Backend to Production

on:
  push:
    branches: [main]

env:
  IMAGE: ghcr.io/official-collabify/collabify-server

jobs:
  deploy:
    name: Build, Migrate & Deploy Backend
    runs-on: ubuntu-latest
    environment: production

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run DB Migrations
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_HOST }}
          username: deploy
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
              -u ${{ github.actor }} --password-stdin || true
            docker run --rm \
              --network collabify_collabify-internal \
              --env-file /opt/collabify/.env.production \
              ${{ env.IMAGE }}:${{ github.sha }} \
              bunx prisma migrate deploy

      - name: Deploy Backend
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_HOST }}
          username: deploy
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
              -u ${{ github.actor }} --password-stdin || true
            cd /opt/collabify
            export SERVER_IMAGE="${{ env.IMAGE }}:${{ github.sha }}"
            docker compose pull server
            docker compose up -d --no-deps server
            docker compose up -d --no-deps caddy
            sleep 5
            docker compose ps
            docker image prune -f
            echo "✅ Backend deploy: ${{ github.sha }}"
