name: Deploy Backend to Production

on:
  push:
    branches: [main]

env:
  IMAGE: ghcr.io/official-collabify/collabify-server

jobs:
  deploy:
    name: Build, Migrate & Deploy Backend
    runs-on: ubuntu-latest
    environment: production

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run DB Migrations
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_HOST }}
          username: deploy
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
              -u ${{ github.actor }} --password-stdin || true
            docker run --rm \
              --env-file /opt/collabify/.env.production \
              ${{ env.IMAGE }}:${{ github.sha }} \
              bunx prisma migrate deploy

      - name: Deploy Backend
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_HOST }}
          username: deploy
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cp /opt/collabify/.image-tags /opt/collabify/.image-tags.prev 2>/dev/null || true
            # Update only backend tag; preserve existing frontend tag
            PREV_FRONTEND=$(grep FRONTEND_TAG /opt/collabify/.image-tags 2>/dev/null | cut -d= -f2 || echo latest)
            echo "BACKEND_TAG=${{ github.sha }}" > /opt/collabify/.image-tags
            echo "FRONTEND_TAG=$PREV_FRONTEND" >> /opt/collabify/.image-tags

            cd /opt/collabify
            BACKEND_TAG=${{ github.sha }} docker compose pull backend
            BACKEND_TAG=${{ github.sha }} docker compose up -d --no-deps --force-recreate backend

            sleep 20
            curl -sf http://localhost:3001/ || \
              (source /opt/collabify/.image-tags.prev && \
               docker compose up -d --no-deps backend && \
               echo "\u274c Backend rollback done" && exit 1)

            docker image prune -f
            echo "\u2705 Backend deploy: ${{ github.sha }}"
