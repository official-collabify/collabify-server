apiVersion: apps/v1
kind: Deployment
metadata:
  name: collabify-stream-worker
  namespace: collabify
spec:
  replicas: 1
  selector:
    matchLabels:
      app: collabify-stream-worker
  template:
    metadata:
      labels:
        app: collabify-stream-worker
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/worker
                    operator: In
                    values: ["true"]
      containers:
        - name: stream-worker
          image: oven/bun:1.2
          workingDir: /app
          command: ["sh", "-c", "bun run src/modules/chat/infra/stream-worker/index.ts || bun run src/app/server.ts"]
          envFrom:
            - configMapRef:
                name: collabify-config
            - secretRef:
                name: collabify-secrets
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: app-code
              mountPath: /app
      volumes:
        - name: app-code
          hostPath:
            path: /opt/collabify
            type: Directory
