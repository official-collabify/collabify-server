apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: collabify-redis
  namespace: collabify
spec:
  serviceName: collabify-redis
  replicas: 1
  selector:
    matchLabels:
      app: collabify-redis
  template:
    metadata:
      labels:
        app: collabify-redis
    spec:
      nodeSelector:
        node-role.kubernetes.io/data: "true"
      containers:
        - name: redis
          image: redis:7-alpine
          command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "noeviction"]
          ports:
            - containerPort: 6379
              hostPort: 6379
              name: redis
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: collabify-redis
  namespace: collabify
spec:
  ports:
    - port: 6379
      targetPort: 6379
  selector:
    app: collabify-redis
